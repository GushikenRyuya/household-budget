<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241b3f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふたりの家計簿">
<link rel="apple-touch-icon" href="icon-kakeibo.png">
<link rel="icon" type="image/png" href="icon-kakeibo.png">
<meta name="format-detection" content="telephone=no">
<title>ふたりの家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe8fc; --grid:rgba(124,98,196,.10); --surface:#fbf9ff; --ink:#34285a; --sub:#7a6ca3; --line:#6f5aa8;
  --accent:#b79cf0; --accent-ink:#2b1f52; --accent-soft:#e4dafa; --danger:#c0407a; --shadow:#b9a6ea; --pos:#23867a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#241b3f; --grid:rgba(183,156,240,.08); --surface:#2f2552; --ink:#f1eaff; --sub:#b7a9de; --line:#9b86d8;
    --accent:#b79cf0; --accent-ink:#241b3f; --accent-soft:#40336b; --danger:#ff8fb8; --shadow:#150e29; --pos:#7be0c3;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size:20px 20px;
  font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;
  font-synthesis:none;
  font-size:16px; line-height:1.55;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
body.no-scroll{overflow:hidden}
.wrap{max-width:640px; margin:0 auto; padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
h1{font-size:1.35rem; margin:0; letter-spacing:.04em; font-weight:400; text-shadow:2px 2px 0 var(--shadow); display:flex; align-items:center; gap:10px}
.logo{width:28px; height:25px; fill:var(--accent); stroke:var(--line); stroke-width:.0; filter:drop-shadow(2px 2px 0 var(--line)); flex:none}
h2{font-size:1.05rem; margin:0 0 12px; font-weight:400; letter-spacing:.04em}
h2::before{content:"■ "; color:var(--accent); text-shadow:1px 1px 0 var(--line)}
.status{font-size:.8rem; color:var(--sub); display:flex; align-items:center; gap:6px}
.dot{width:10px; height:10px; background:var(--accent-soft); border:2px solid var(--line)}
.dot.on{background:var(--accent)}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
:focus-visible{outline:3px dashed var(--ink); outline-offset:2px}
[hidden]{display:none !important}

.btn{border:3px solid var(--line); background:var(--surface); border-radius:0; min-height:48px; padding:0 16px;
  box-shadow:4px 4px 0 var(--shadow); margin:0 4px 4px 0}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:calc(100% - 4px); margin-top:12px}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--shadow)}

input[type=text], input[type=date], select{
  font:inherit; font-size:16px; color:inherit; background:var(--surface);
  border:3px solid var(--line); border-radius:0; padding:8px 12px; width:100%; min-height:48px;
}
input[type=date]{appearance:none; -webkit-appearance:none}
input:focus, select:focus{outline:none; border-color:var(--ink); box-shadow:3px 3px 0 var(--accent)}

.card{background:var(--surface); border:3px solid var(--line); border-radius:0; padding:14px; margin:0 5px 20px 0; box-shadow:5px 5px 0 var(--shadow)}
.field{margin-bottom:16px}
.field > label, .field > .lab{display:block; font-size:.85rem; color:var(--sub); margin-bottom:6px}
.hint{font-size:.78rem; color:var(--sub); margin-top:8px}
.amount-wrap{position:relative}
.amount-wrap span{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1.5rem; color:var(--sub); pointer-events:none}
.amount{font-size:1.8rem !important; padding-left:40px !important; min-height:60px !important}
.chips{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.chip{border:3px solid var(--line); background:var(--surface); border-radius:0; min-height:48px; padding:4px 6px; font-size:.9rem; line-height:1.3}
.chip.on{background:var(--accent); color:var(--accent-ink); box-shadow:inset 0 0 0 2px var(--surface)}

.segs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px}
.segs.two{grid-template-columns:1fr 1fr; margin-bottom:0}
.seg{border:3px solid var(--line); background:var(--surface); border-radius:0; min-height:44px; padding:0 6px}
.seg.on{background:var(--accent); color:var(--accent-ink); box-shadow:inset 0 0 0 2px var(--surface)}

.total{text-align:center; padding:18px 14px 14px}
.total .lab{font-size:.85rem; color:var(--sub)}
.total .num{font-size:2.2rem; letter-spacing:.02em; text-shadow:2px 2px 0 var(--accent-soft); line-height:1.3}
.split{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; padding-top:12px; border-top:3px dotted var(--line)}
.split span{display:block; font-size:.8rem; color:var(--sub)}
.split b{font-size:1.2rem; font-weight:400}
.nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
.nav .btn{width:52px; padding:0; font-size:1.1rem}
.nav .label{font-size:1.25rem; letter-spacing:.04em; text-shadow:2px 2px 0 var(--shadow)}

.brow{margin-bottom:14px}
.brow:last-child{margin-bottom:0}
.brow-top{display:flex; justify-content:space-between; gap:8px; font-size:.95rem}
.brow-val{color:var(--sub); white-space:nowrap}
.bar{height:16px; background:var(--accent-soft); border:2px solid var(--line); margin-top:5px; padding:2px}
.bar i{display:block; height:100%; background:repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 10px)}
button.brow{display:block; width:100%; text-align:left; background:none; border:none; padding:6px 0; margin:0 0 6px}

.day{display:flex; justify-content:space-between; font-size:.85rem; color:var(--sub); margin:18px 0 8px; padding-bottom:4px; border-bottom:3px dotted var(--line)}
.entry{display:flex; align-items:center; justify-content:space-between; gap:10px; width:calc(100% - 4px); text-align:left;
  background:var(--surface); border:3px solid var(--line); border-radius:0; padding:8px 12px; margin:0 4px 10px 0; min-height:60px; box-shadow:3px 3px 0 var(--shadow)}
.entry:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)}
.e-ico{font-size:1.6rem; width:38px; text-align:center; flex:none; line-height:1}
.e-main{flex:1; min-width:0}
.e-cat{font-size:1.02rem}
.e-sub{font-size:.8rem; color:var(--sub)}
.e-amt{white-space:nowrap; font-size:1.05rem}
.empty{color:var(--sub); text-align:center; padding:28px 8px}
.mhead{display:flex; justify-content:space-between; align-items:center; gap:10px; width:calc(100% - 4px); text-align:left;
  background:var(--surface); border:3px solid var(--line); border-radius:0; box-shadow:3px 3px 0 var(--shadow);
  min-height:52px; padding:0 12px; margin:0 4px 10px 0}
.mhead[aria-expanded="true"]{background:var(--accent); color:var(--accent-ink)}
.mhead .cnt{font-size:.85rem; opacity:.8}
.tpls{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.chip.tpl{min-height:56px}
.tpl-amt{font-size:.75rem; color:var(--sub)}
.pos{color:var(--pos)}
.neg{color:var(--danger)}
.subh{font-size:.85rem; color:var(--sub); margin:14px 0 10px; padding-top:10px; border-top:3px dotted var(--line)}
button.balrow{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; border-bottom:3px dotted var(--line); padding:8px 0; margin:0}
button.balrow:last-child{border-bottom:none}
.balrow .sub{font-size:.75rem; color:var(--sub)}
.balrow .v{font-size:1.05rem; white-space:nowrap}

#tabs{position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--surface); border-top:3px solid var(--line);
  display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:env(safe-area-inset-bottom)}
#tabs button{background:none; border:none; padding:8px 0 6px; min-height:58px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--sub); font-size:.78rem}
#tabs button + button{border-left:3px solid var(--line)}
#tabs button.on{background:var(--accent); color:var(--accent-ink)}
#tabs svg{width:24px; height:24px; fill:currentColor}

.sheet-back{position:fixed; inset:0; background:rgba(36,27,63,.55); z-index:30; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow-y:auto; border:3px solid var(--line); border-bottom:none; border-radius:0;
  box-shadow:0 -5px 0 var(--shadow); padding:16px 14px calc(16px + env(safe-area-inset-bottom))}

.gate{max-width:420px; margin:12vh auto 0; padding:0 20px}
.gate p{color:var(--sub); font-size:.9rem}
.err{color:var(--danger); font-size:.9rem; margin-top:10px; word-break:break-all}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  border:3px solid var(--line); border-radius:0; box-shadow:4px 4px 0 var(--shadow);
  padding:10px 18px; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; z-index:40; text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg class="logo" viewBox="0 0 8 7" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 0h2v1H1z M5 0h2v1H5z M0 1h8v3H0z M1 4h6v1H1z M2 5h4v1H2z M3 6h2v1H3z"/></svg>ふたりの家計簿</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="stat">接続中…</span></div>
  </header>
  <main>
    <div id="v-input"></div>
    <div id="v-month" hidden></div>
    <div id="v-year" hidden></div>
    <div id="v-master" hidden></div>
  </main>
</div>
<nav id="tabs" aria-label="画面切り替え"></nav>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  function show(msg){
    var m=document.querySelector("main");
    if(m && !document.getElementById("v-input").children.length){
      m.innerHTML='<div class="gate"><h1>表示できませんでした</h1><p></p></div>';
      m.querySelector("p").textContent=msg;
    }
  }
  window.addEventListener("error",function(e){ setTimeout(function(){show("エラー: "+e.message+"(firebase-config.js が正しいか確認してください)")},0); });
  setTimeout(function(){show("読み込みに失敗しました。firebase-config.js が配置され、正しい内容か確認してください。")},4000);
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

// ================= 固定の選択肢 =================
const SCOPES = ["共有", "個人"];
const CATS = {
  "共有": ["家賃＆水道","光熱費","食費","習い事","学童","学校","医療費","衣服","娯楽費","外食","お祝い金","お泊り代","理髪","消耗品","その他"],
  "個人": ["食費","習い事","医療費","衣服","娯楽費","外食","お祝い金","携帯","保険","カード","車ローン","奨学金","借金返済","美容","理髪","貯金","ATM手数料","ガソリン","サブスク","その他"]
};
// 保存される支払方法の名前は「支払者 + 種類」(例: ひなた現金)。未選択は「共有現金」
const METHODS = [
  { n:"ひなた現金", who:"ひなた" },
  { n:"ぐしけん現金", who:"ぐしけん" },
  { n:"共有現金", who:"共有" },
  { n:"ひなた個人カード", who:"ひなた" },
  { n:"ぐしけん個人カード", who:"ぐしけん" },
  { n:"ひなたコード決済", who:"ひなた" },
  { n:"ぐしけんコード決済", who:"ぐしけん" },
  { n:"ひなた口座引落", who:"ひなた" },
  { n:"ぐしけん口座引落", who:"ぐしけん" }
];
const PAY_TYPES = [
  { key:"現金",       name:"現金",       alias:["現金"] },
  { key:"カード",     name:"個人カード", alias:["個人カード", "カード"] },
  { key:"コード決済", name:"コード決済", alias:["コード決済"] },
  { key:"口座引落",   name:"口座引落",   alias:["口座引落", "引落", "口座引き落とし"] }
];
const FALLBACK_METHOD = "共有現金";
const WHO = ["ひなた", "ぐしけん", "共有"];
const PEOPLE = ["ひなた", "ぐしけん"];
const INCOME_CATS = ["給与", "単発バイト"];
const isIncome = e => e.type === "income";   // type がない古い記録は支出
const whoOf = m => {
  const f = METHODS.find(x => x.n === m);
  if (f) return f.who;
  m = String(m || "");
  if (m.startsWith("ひなた")) return "ひなた";
  if (m.startsWith("ぐしけん")) return "ぐしけん";
  if (m.startsWith("共有")) return "共有";
  return "その他";
};
const scopeOf = e => e.scope === "個人" ? "個人" : "共有";   // 区分のない古い記録は「共有」扱い

// 保存された支払方法の名前 → 支払者と種類
function parsePay(n){
  n = String(n || "");
  if (!n || n === FALLBACK_METHOD) return { person:"", ptype:"", ok:true };
  const person = PEOPLE.find(p => n.startsWith(p)) || "";
  if (!person) return { person:"", ptype:"", ok:false };
  const rest = n.slice(person.length);
  const t = PAY_TYPES.find(p => p.alias.includes(rest));
  return t ? { person, ptype:t.key, ok:true } : { person, ptype:"", ok:false };
}

// 保存されるのは名前だけ。アイコンは表示のときに付けます
const CAT_ICON = {
  "家賃＆水道":"🏠","光熱費":"💡","食費":"🍚","習い事":"📚","学童":"🎒","学校":"🏫","医療費":"🏥","衣服":"👕",
  "娯楽費":"🎮","外食":"🍽️","お祝い金":"🎁","お泊り代":"🏨","理髪":"💇","消耗品":"🧻","その他":"📦",
  "携帯":"📱","保険":"🛡️","カード":"💳","車ローン":"🚗","奨学金":"🎓","借金返済":"💸","美容":"💄","貯金":"🐷",
  "ATM手数料":"🏧","ガソリン":"⛽","サブスク":"📺","給与":"💴","単発バイト":"⏱️",
  // 以前のカテゴリー名(過去の記録の表示用)
  "家賃":"🏠","あおなぎ習い事費":"📚","学童費":"🎒","学校費":"🏫","服代":"👕","外食費":"🍽️","行事費":"🎉","携帯代":"📱",
  "保険代":"🛡️","カード払い":"💳","借金返金代":"💸","飛向習い事費":"✏️","美容費":"💄","理髪代":"💇","予想外の出費":"⚠️",
  "ガソリン代":"⛽","消耗品代金":"🧻"
};
const WHO_ICON = { "ひなた":"🤯", "ぐしけん":"🤓", "共有":"🤝" };
const catIcon = c => CAT_ICON[c] || "🏷️";
const catLabel = c => `${catIcon(c)} ${c}`;
const whoLabel = w => WHO_ICON[w] ? `${WHO_ICON[w]} ${w}` : w;
const methodLabel = n => { const ic = WHO_ICON[whoOf(n)]; return ic ? `${ic} ${n}` : n; };

// ================= 共通ヘルパー =================
const $ = id => document.getElementById(id);
const toastEl = $("toast");
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"), 2200); }
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}
const pad2 = n => String(n).padStart(2, "0");
const yen = n => "¥" + Number(n).toLocaleString("ja-JP");
const signYen = n => (n > 0 ? "+" : n < 0 ? "−" : "") + yen(Math.abs(n));
const toHalf = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const WD = ["日","月","火","水","木","金","土"];
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDay = s => { const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
const sum = list => list.reduce((a, e) => a + e.amount, 0);
function sumBy(list, keyFn){
  const m = new Map();
  for (const e of list){ const k = keyFn(e); m.set(k, (m.get(k) || 0) + e.amount); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
const lsGet = k => { try{ return localStorage.getItem(k) || ""; }catch{ return ""; } };
const lsSet = (k, v) => { try{ if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); }catch{} };

// ================= Firebase =================
if (!firebaseConfig || String(firebaseConfig.apiKey).startsWith("YOUR_")){
  document.querySelector("main").innerHTML = '<div class="gate"><h1>設定がまだです</h1><p>firebase-config.js に Firebase の設定を貼り付けてください。</p></div>';
  throw new Error("firebase-config.js is not configured");
}
const app = initializeApp(firebaseConfig);
let db;
try{
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}catch(e){ db = getFirestore(app); }
const col = collection(db, "households", "main", "entries");
const entryRef = id => doc(col, id);
const tplCol = collection(db, "households", "main", "templates");
const tplRef = id => doc(tplCol, id);
const safe = p => Promise.resolve(p).catch(e => { console.error(e); toast("保存できませんでした。通信を確認してください"); });

// ================= 状態 =================
const now = new Date();
const state = { tab:"input", year: now.getFullYear(), month: now.getMonth() + 1, filter:"all" };
let yearEntries = [], yearLoaded = false, unsubYear = null;
let histEntries = [], histLoaded = false;
let templates = [], tplError = false;
let online = false;
const openMonths = new Set();   // 入力タブの履歴で開いている月

function onErr(err){
  console.error(err);
  document.querySelector("main").replaceChildren(el("div", {class:"gate"}, el("h1", {}, "読み込めません"),
    el("p", {}, "Firestore のルール設定か、firebase-config.js を確認してください。"), el("div", {class:"err"}, String(err.message))));
}
function subscribeYear(y){
  if (unsubYear) unsubYear();
  yearLoaded = false; yearEntries = [];
  const q = query(col, where("date", ">=", `${y}-01-01`), where("date", "<=", `${y}-12-31`));
  unsubYear = onSnapshot(q, snap => {
    if (snap.metadata.fromCache && snap.empty && !yearLoaded){ refresh(); return; }
    yearLoaded = true;
    online = !snap.metadata.fromCache;
    yearEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refresh();
  }, onErr);
  setTimeout(() => { if (!yearLoaded && state.year === y){ yearLoaded = true; refresh(); } }, 3000);
}
// 入力タブの履歴: 半年分(今月を含む6か月)
function histStartStr(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 5);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-01`;
}
onSnapshot(query(col, where("date", ">=", histStartStr())), snap => {
  if (snap.metadata.fromCache && snap.empty && !histLoaded) return;
  histLoaded = true;
  online = online || !snap.metadata.fromCache;
  histEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  refresh();
}, onErr);
setTimeout(() => { if (!histLoaded){ histLoaded = true; refresh(); } }, 3000);
// テンプレート(マスタ)
onSnapshot(tplCol, snap => {
  tplError = false;
  templates = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
  refresh();
}, err => { console.error(err); tplError = true; refresh(); });

// ================= モーダル =================
function openModal(...kids){
  const back = el("div", {class:"sheet-back"});
  const close = () => { back.remove(); document.body.classList.remove("no-scroll"); };
  back.addEventListener("click", e => { if (e.target === back) close(); });
  back.append(el("div", {class:"sheet", role:"dialog", "aria-modal":"true"}, ...kids));
  document.body.append(back);
  document.body.classList.add("no-scroll");
  return close;
}

// ================= フォーム(入力・編集・テンプレートで共通) =================
function buildForm(init){
  let type = init.type === "income" ? "income" : "expense";
  const amount = el("input", {type:"text", class:"amount", inputMode:"numeric", placeholder:"0", autocomplete:"off", "aria-label":"金額"});
  const setAmount = n => { amount.value = n ? Number(n).toLocaleString("ja-JP") : ""; };
  setAmount(init.amount);
  amount.addEventListener("input", () => {
    const d = toHalf(amount.value).replace(/[^0-9]/g, "").slice(0, 9);
    amount.value = d ? Number(d).toLocaleString("ja-JP") : "";
  });
  const date = el("input", {type:"date", value: init.date || todayStr(), "aria-label":"日付"});

  // --- 支出: 共有 / 個人 とカテゴリー ---
  let scope = init.scope === "個人" ? "個人" : "共有";
  const category = el("select", {"aria-label":"カテゴリー"});
  function fillCats(keep){
    const list = [...CATS[scope]];
    if (keep && keep === init.category && !list.includes(keep)) list.push(keep);   // 以前のカテゴリー名
    category.replaceChildren(el("option", {value:""}, "選択してください"), ...list.map(c => el("option", {value:c}, catLabel(c))));
    category.value = list.includes(keep) ? keep : "";
  }
  fillCats(init.type === "income" ? "" : init.category);
  const scopeBtns = SCOPES.map(sc => {
    const b = el("button", {type:"button", class:"seg"}, `${sc}カテゴリ`);
    b.addEventListener("click", () => {
      if (scope === sc) return;
      const cur = category.value;
      scope = sc; scopeSync(); fillCats(cur);
      if (init.onScope) init.onScope(sc);
    });
    return b;
  });
  function scopeSync(){ scopeBtns.forEach((b, i) => { const on = SCOPES[i] === scope; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); }
  scopeSync();

  // --- 支出: 支払い者(ひなた/ぐしけん) + 支払方法(現金/カード/コード決済/口座引落) ---
  const ip = parsePay(init.type === "income" ? "" : init.method);
  let person = ip.person || (init.method == null ? (PEOPLE.includes(init.person) ? init.person : "") : "");
  let ptype  = ip.ptype  || (init.method == null ? (PAY_TYPES.some(p => p.key === init.ptype) ? init.ptype : "") : "");
  let rawMethod = (!ip.ok && init.type !== "income" && init.method) ? String(init.method) : null;   // 一覧にない古い名前
  let payTouched = false;
  const personBtns = PEOPLE.map(w => {
    const b = el("button", {type:"button", class:"chip"}, whoLabel(w));
    b.addEventListener("click", () => { person = person === w ? "" : w; payTouched = true; paySync(); if (init.onPay) init.onPay(person, ptype); });
    return b;
  });
  const typeBtns2 = PAY_TYPES.map(p => {
    const b = el("button", {type:"button", class:"chip"}, p.key);
    b.addEventListener("click", () => { ptype = ptype === p.key ? "" : p.key; payTouched = true; paySync(); if (init.onPay) init.onPay(person, ptype); });
    return b;
  });
  function paySync(){
    personBtns.forEach((b, i) => { const on = PEOPLE[i] === person; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
    typeBtns2.forEach((b, i) => { const on = PAY_TYPES[i].key === ptype; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  }
  paySync();

  // --- 収入: 種類(給与・単発バイト)と受取人 ---
  let incCat = init.type === "income" && INCOME_CATS.includes(init.category) ? init.category : INCOME_CATS[0];
  const incBtns = INCOME_CATS.map(c => {
    const b = el("button", {type:"button", class:"chip"}, catLabel(c));
    b.addEventListener("click", () => { incCat = c; incSync(); });
    return b;
  });
  function incSync(){ incBtns.forEach((b, i) => { const on = INCOME_CATS[i] === incCat; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); }
  incSync();
  let who = PEOPLE.includes(init.who) ? init.who : "";
  const whoBtns = PEOPLE.map(w => {
    const b = el("button", {type:"button", class:"chip"}, whoLabel(w));
    b.addEventListener("click", () => { who = who === w ? "" : w; whoSync(); if (init.onWho) init.onWho(who); });
    return b;
  });
  function whoSync(){ whoBtns.forEach((b, i) => { const on = PEOPLE[i] === who; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); }
  whoSync();

  const expenseBlock = el("div", {},
    el("div", {class:"field"}, el("div", {class:"lab"}, "区分とカテゴリー"),
      el("div", {class:"segs two", role:"group", style:"margin-bottom:8px"}, ...scopeBtns), category),
    el("div", {class:"field"}, el("div", {class:"lab"}, "支払い者"), el("div", {class:"chips", role:"group"}, ...personBtns)),
    el("div", {class:"field"}, el("div", {class:"lab"}, "支払方法"), el("div", {class:"chips", role:"group"}, ...typeBtns2),
      el("div", {class:"hint"}, "どちらも未選択のときは「共有現金」として記録されます(もう一度タップで解除)")));
  const incomeBlock = el("div", {},
    el("div", {class:"field"}, el("div", {class:"lab"}, "収入の種類"), el("div", {class:"chips", role:"group"}, ...incBtns)),
    el("div", {class:"field"}, el("div", {class:"lab"}, "受取人"), el("div", {class:"chips", role:"group"}, ...whoBtns)));

  // --- 支出 / 収入 の切り替え(編集時は固定) ---
  const TYPES = [["expense", "支出"], ["income", "収入"]];
  const typeBtns = TYPES.map(([k, t]) => {
    const b = el("button", {type:"button", class:"seg"}, t);
    b.addEventListener("click", () => { type = k; typeSync(); });
    return b;
  });
  function typeSync(){
    typeBtns.forEach((b, i) => { const on = TYPES[i][0] === type; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
    expenseBlock.hidden = type !== "expense";
    incomeBlock.hidden = type !== "income";
  }
  typeSync();
  const typeBar = init.lockType ? null : el("div", {class:"segs two", role:"group", "aria-label":"支出か収入か", style:"margin-bottom:16px"}, ...typeBtns);

  const node = el("div", {}, typeBar,
    el("div", {class:"field"}, el("label", {}, init.amountOptional ? "金額(円)・空でもOK" : "金額(円)"), el("div", {class:"amount-wrap"}, el("span", {}, "¥"), amount)),
    init.noDate ? null : el("div", {class:"field"}, el("label", {}, "日付"), date),
    expenseBlock, incomeBlock);

  return {
    el: node,
    reset(){ amount.value = ""; category.value = ""; },
    // テンプレートの内容を入力欄にセット(日付は変えない)
    fill(v){
      type = v.type === "income" ? "income" : "expense";
      typeSync();
      setAmount(v.amount);
      if (type === "income"){
        incCat = INCOME_CATS.includes(v.category) ? v.category : INCOME_CATS[0]; incSync();
        who = PEOPLE.includes(v.who) ? v.who : ""; whoSync();
      }else{
        scope = v.scope === "個人" ? "個人" : "共有"; scopeSync(); fillCats(v.category);
        const p = parsePay(v.method);
        person = p.person; ptype = p.ptype; rawMethod = null; payTouched = true; paySync();
      }
    },
    get(opts = {}){
      const amt = Number(toHalf(amount.value).replace(/[^0-9]/g, ""));
      if (!opts.template){
        if (!amt){ toast("金額を入力してください"); return null; }
        if (!date.value){ toast("日付を選んでください"); return null; }
      }
      if (type === "income"){
        if (!who){ toast("受取人を選んでください"); return null; }
        return { amount: amt, date: date.value, category: incCat, method: "収入", who, type: "income" };
      }
      if (!category.value){ toast("カテゴリーを選んでください"); return null; }
      let method;
      if (rawMethod && !payTouched) method = rawMethod;
      else if (!person && !ptype) method = FALLBACK_METHOD;
      else if (person && ptype) method = person + PAY_TYPES.find(p => p.key === ptype).name;
      else { toast(person ? "支払方法(現金・カードなど)を選んでください" : "支払い者(ひなた・ぐしけん)を選んでください"); return null; }
      return { amount: amt, date: date.value, category: category.value, method, scope, type: "expense" };
    }
  };
}

// ================= 編集シート(入力済みの記録) =================
function openSheet(entry){
  const f = buildForm({ ...entry, scope: scopeOf(entry), lockType: true });
  let close;
  close = openModal(
    el("h2", {}, isIncome(entry) ? "収入を編集" : "支出を編集"), f.el,
    el("button", {type:"button", class:"btn primary block", onclick: () => {
      const v = f.get(); if (!v) return;
      safe(updateDoc(entryRef(entry.id), v)); close(); toast("保存しました");
    }}, "保存"),
    el("button", {type:"button", class:"btn danger block", onclick: () => {
      if (confirm(isIncome(entry) ? "この収入を削除しますか?" : "この支出を削除しますか?")){ safe(deleteDoc(entryRef(entry.id))); close(); toast("削除しました"); }
    }}, "削除"),
    el("button", {type:"button", class:"btn block", onclick: () => close()}, "閉じる"));
}

// ================= 編集シート(テンプレート) =================
function openTemplateSheet(t){
  const name = el("input", {type:"text", placeholder:"例: 家賃、給与、ネット代", value: t ? t.name : "", maxLength:20, autocomplete:"off", "aria-label":"テンプレート名"});
  const f = buildForm({ ...(t || {}), noDate:true, amountOptional:true });
  let close;
  const kids = [
    el("h2", {}, t ? "テンプレートを編集" : "テンプレートを追加"),
    el("div", {class:"field"}, el("label", {}, "ボタンの名前"), name),
    f.el,
    el("button", {type:"button", class:"btn primary block", onclick: () => {
      const nm = name.value.trim();
      if (!nm){ toast("ボタンの名前を入力してください"); return; }
      const v = f.get({ template:true }); if (!v) return;
      const data = { name: nm, type: v.type, amount: v.amount, category: v.category, method: v.method,
        ...(v.type === "income" ? { who: v.who } : { scope: v.scope }),
        createdAt: t ? (t.createdAt || Date.now()) : Date.now(), order: t ? (t.order ?? t.createdAt ?? Date.now()) : Date.now() };
      safe(setDoc(t ? tplRef(t.id) : doc(tplCol), data)); close(); toast("テンプレートを保存しました");
    }}, "保存")
  ];
  if (t) kids.push(el("button", {type:"button", class:"btn danger block", onclick: () => {
    if (confirm(`「${t.name}」を削除しますか?`)){ safe(deleteDoc(tplRef(t.id))); close(); toast("削除しました"); }
  }}, "削除"));
  kids.push(el("button", {type:"button", class:"btn block", onclick: () => close()}, "閉じる"));
  close = openModal(...kids);
}

// ================= 部品 =================
function entryRow(e, showDate){
  const inc = isIncome(e);
  const sub = (inc
    ? [showDate ? fmtDay(e.date) : null, "収入", e.who ? whoLabel(e.who) : null]
    : [showDate ? fmtDay(e.date) : null, scopeOf(e), methodLabel(e.method)]).filter(Boolean).join(" ・ ");
  return el("button", {type:"button", class:"entry", onclick: () => openSheet(e)},
    el("div", {class:"e-ico", "aria-hidden":"true"}, catIcon(e.category)),
    el("div", {class:"e-main"}, el("div", {class:"e-cat"}, e.category), el("div", {class:"e-sub"}, sub)),
    el("div", {class:"e-amt" + (inc ? " pos" : "")}, (inc ? "+" : "") + yen(e.amount)));
}
function barRow(label, value, total, tag = "div", onclick){
  const pct = total ? Math.round(value / total * 100) : 0;
  const w = value > 0 ? Math.max(pct, 2) : 0;
  const props = tag === "button" ? { type:"button", class:"brow", onclick } : { class:"brow" };
  return el(tag, props,
    el("div", {class:"brow-top"}, el("span", {}, label), el("span", {class:"brow-val"}, `${yen(value)}${tag === "div" ? ` (${pct}%)` : ""}`)),
    el("div", {class:"bar"}, el("i", {style:`width:${w}%`})));
}
function breakdownCard(title, rows, total, labelFn = x => x){
  if (!rows.length) return null;
  return el("div", {class:"card"}, el("h2", {}, title), ...rows.map(([k, v]) => barRow(labelFn(k), v, total)));
}
function nav(label, onPrev, onNext){
  return el("div", {class:"nav"},
    el("button", {type:"button", class:"btn", "aria-label":"前へ", onclick:onPrev}, "◀"),
    el("div", {class:"label"}, label),
    el("button", {type:"button", class:"btn", "aria-label":"次へ", onclick:onNext}, "▶"));
}
// 支出の合計 + 共有 + 個人
function totalCard(label, list){
  const shared = sum(list.filter(e => scopeOf(e) === "共有"));
  const all = sum(list);
  return el("div", {class:"card total"},
    el("div", {class:"lab"}, label), el("div", {class:"num"}, yen(all)),
    el("div", {class:"split"},
      el("div", {}, el("span", {}, "共有"), el("b", {}, yen(shared))),
      el("div", {}, el("span", {}, "個人"), el("b", {}, yen(all - shared)))));
}
// 収支(収入 − 支出。プラスもマイナスも表示)
function summaryCard(label, list){
  const inc = sum(list.filter(isIncome));
  const exp = sum(list.filter(e => !isIncome(e)));
  const bal = inc - exp;
  return el("div", {class:"card total"},
    el("div", {class:"lab"}, label),
    el("div", {class:"num " + (bal < 0 ? "neg" : "pos")}, signYen(bal)),
    el("div", {class:"split"},
      el("div", {}, el("span", {}, "収入"), el("b", {class:"pos"}, yen(inc))),
      el("div", {}, el("span", {}, "支出"), el("b", {}, yen(exp)))));
}
function incomeCard(list){
  if (!list.length) return null;
  const total = sum(list);
  return el("div", {class:"card"}, el("h2", {}, `収入の内訳 ・ ${yen(total)}`),
    ...sumBy(list, e => e.category).map(([k, v]) => barRow(catLabel(k), v, total)),
    el("div", {class:"subh"}, "受取人別"),
    ...PEOPLE.map(w => barRow(whoLabel(w), sum(list.filter(e => e.who === w)), total)));
}
function filterBar(){
  const opts = [["all", "すべて"], ["共有", "共有"], ["個人", "個人"]];
  return el("div", {class:"segs", role:"group", "aria-label":"表示の切り替え"}, ...opts.map(([k, t]) =>
    el("button", {type:"button", class:"seg" + (state.filter === k ? " on" : ""), "aria-pressed":String(state.filter === k),
      onclick: () => { state.filter = k; refresh(); }}, t)));
}
const applyFilter = list => state.filter === "all" ? list : list.filter(e => scopeOf(e) === state.filter);
function whoCard(list, total){
  const m = new Map(WHO.map(w => [w, 0]));
  for (const e of list){ const w = whoOf(e.method); m.set(w, (m.get(w) || 0) + e.amount); }
  return el("div", {class:"card"}, el("h2", {}, "支払い者別"), ...[...m.entries()].map(([k, v]) => barRow(whoLabel(k), v, total)));
}
// 共有カテゴリ別・個人カテゴリ別(表示の切り替えに合わせて出し分け)
function categoryCards(list){
  const cards = [];
  for (const sc of SCOPES){
    if (state.filter !== "all" && state.filter !== sc) continue;
    const sub = list.filter(e => scopeOf(e) === sc);
    cards.push(breakdownCard(`${sc}カテゴリ別 ・ ${yen(sum(sub))}`, sumBy(sub, e => e.category), sum(sub), catLabel));
  }
  return cards;
}

// 履歴: 半年分を月ごとにたたんで表示。月の見出しを押すと開く
function renderHistory(){
  const kids = [el("h2", {}, "最近の入力(半年分)")];
  if (!histLoaded) kids.push(el("div", {class:"empty"}, "読み込み中…"));
  else if (!histEntries.length) kids.push(el("div", {class:"empty"}, "まだ入力がありません"));
  else{
    const byMonth = new Map();
    for (const e of histEntries){
      const k = e.date.slice(0, 7);
      if (!byMonth.has(k)) byMonth.set(k, []);
      byMonth.get(k).push(e);
    }
    for (const k of [...byMonth.keys()].sort().reverse()){
      const list = byMonth.get(k);
      const open = openMonths.has(k);
      const [y, m] = k.split("-");
      kids.push(el("button", {type:"button", class:"mhead", "aria-expanded":String(open),
        onclick: () => { if (open) openMonths.delete(k); else openMonths.add(k); const sy = window.scrollY; renderHistory(); window.scrollTo(0, sy); }},
        el("span", {}, `${open ? "▼" : "▶"} ${y}年${Number(m)}月`), el("span", {class:"cnt"}, `${list.length}件`)));
      if (open){
        const sorted = [...list].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
        for (const e of sorted) kids.push(entryRow(e, true));
      }
    }
  }
  histSlot.replaceChildren(...kids);
}
function renderInput(){ renderTemplateButtons(); renderHistory(); }

  v.replaceChildren(...kids);
  window.scrollTo(0, y);

// ================= 画面: 月別 =================
function setPeriod(y, m){
  const changed = y !== state.year;
  state.year = y; state.month = m;
  if (changed) subscribeYear(y);
  refresh();
}
function shiftMonth(d){
  let y = state.year, m = state.month + d;
  if (m < 1){ m = 12; y--; }
  if (m > 12){ m = 1; y++; }
  setPeriod(y, m);
}
function renderMonth(){
  const v = views.month;
  const head = nav(`${state.year}年${state.month}月`, () => shiftMonth(-1), () => shiftMonth(1));
  if (!yearLoaded){ v.replaceChildren(head, el("div", {class:"empty"}, "読み込み中…")); return; }
  const prefix = `${state.year}-${pad2(state.month)}-`;
  const monthAll = yearEntries.filter(e => e.date.startsWith(prefix));
  const exp = monthAll.filter(e => !isIncome(e));
  const inc = monthAll.filter(isIncome);
  const kids = [head, summaryCard(`${state.month}月の収支`, monthAll)];
  if (!monthAll.length){
    kids.push(el("div", {class:"empty"}, "この月の記録はまだありません"));
  }else{
    kids.push(incomeCard(inc));
    if (exp.length){
      kids.push(totalCard(`${state.month}月の支出合計`, exp));
      kids.push(filterBar());
      const list = applyFilter(exp);
      const total = sum(list);
      if (!list.length){
        kids.push(el("div", {class:"empty"}, "この区分の支出はありません"));
      }else{
        kids.push(...categoryCards(list));
        kids.push(whoCard(list, total));
        kids.push(breakdownCard("支払方法別", sumBy(list, e => e.method), total, methodLabel));
      }
    }
  }
  const y = window.scrollY;
  v.replaceChildren(...kids.filter(Boolean));
  window.scrollTo(0, y);
}

// ================= 画面: 年別 =================
function renderYear(){
  const v = views.year;
  const head = nav(`${state.year}年`, () => setPeriod(state.year - 1, state.month), () => setPeriod(state.year + 1, state.month));
  if (!yearLoaded){ v.replaceChildren(head, el("div", {class:"empty"}, "読み込み中…")); return; }
  const exp = yearEntries.filter(e => !isIncome(e));
  const inc = yearEntries.filter(isIncome);
  const kids = [head, summaryCard(`${state.year}年の収支`, yearEntries)];
  if (!yearEntries.length){
    kids.push(el("div", {class:"empty"}, "この年の記録はまだありません"));
  }else{
    kids.push(incomeCard(inc));

    // 月ごとの収支(収入 − 支出)
    const rows = Array.from({length:12}, (_, i) => {
      const m = yearEntries.filter(e => e.date.startsWith(`${state.year}-${pad2(i + 1)}-`));
      const mi = sum(m.filter(isIncome)), me = sum(m.filter(e => !isIncome(e)));
      return { i, mi, me, bal: mi - me, n: m.length };
    });
    kids.push(el("div", {class:"card"}, el("h2", {}, "月ごとの収支(タップで月別へ)"),
      ...rows.map(r => el("button", {type:"button", class:"balrow", onclick: () => { setPeriod(state.year, r.i + 1); setTab("month"); }},
        el("div", {}, el("div", {}, `${r.i + 1}月`), r.n ? el("div", {class:"sub"}, `収入 ${yen(r.mi)} ・ 支出 ${yen(r.me)}`) : null),
        el("div", {class:"v " + (r.n ? (r.bal < 0 ? "neg" : "pos") : "")}, r.n ? signYen(r.bal) : "—")))));

    if (exp.length){
      kids.push(totalCard(`${state.year}年の支出合計`, exp));
      kids.push(filterBar());
      const list = applyFilter(exp);
      const total = sum(list);
      if (!list.length){
        kids.push(el("div", {class:"empty"}, "この区分の支出はありません"));
      }else{
        const byMonth = Array.from({length:12}, (_, i) => sum(list.filter(e => e.date.startsWith(`${state.year}-${pad2(i + 1)}-`))));
        const max = Math.max(...byMonth);
        kids.push(el("div", {class:"card"}, el("h2", {}, "月ごとの支出の推移"),
          ...byMonth.map((val, i) => barRow(`${i + 1}月`, val, max, "button", () => { setPeriod(state.year, i + 1); setTab("month"); }))));
        kids.push(...categoryCards(list));
        kids.push(whoCard(list, total));
        kids.push(breakdownCard("支払方法別", sumBy(list, e => e.method), total, methodLabel));
      }
    }
  }
  const y = window.scrollY;
  v.replaceChildren(...kids.filter(Boolean));
  window.scrollTo(0, y);
}

// ================= タブ・更新 =================
const ICONS = {
  input:  '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h10v1H1z M1 11h10v1H1z M0 1h1v10H0z M11 1h1v10h-1z M5 3h2v6H5z M3 5h6v2H3z"/></svg>',
  month:  '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 2h10v1H1z M1 10h10v1H1z M1 3h1v7H1z M10 3h1v7h-1z M1 5h10v1H1z M3 0h1v3H3z M8 0h1v3H8z M3 7h2v2H3z M7 7h2v2H7z"/></svg>',
  year:   '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 8h2v3H1z M5 5h2v6H5z M9 2h2v9H9z M0 11h12v1H0z"/></svg>',
  master: '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 2h2v2H1z M5 2h6v2H5z M1 5h2v2H1z M5 5h6v2H5z M1 8h2v2H1z M5 8h6v2H5z"/></svg>'
};
const TAB_LABELS = { input:"入力", month:"月別", year:"年別", master:"マスタ" };
const tabBtns = {};
for (const k of Object.keys(TAB_LABELS)){
  const b = el("button", {type:"button", onclick: () => setTab(k)});
  b.innerHTML = ICONS[k] + `<span>${TAB_LABELS[k]}</span>`;
  tabBtns[k] = b;
  $("tabs").append(b);
}
function setTab(t){
  state.tab = t;
  for (const k of Object.keys(views)){
    views[k].hidden = k !== t;
    tabBtns[k].classList.toggle("on", k === t);
    tabBtns[k].setAttribute("aria-current", k === t ? "page" : "false");
  }
  refresh();
  window.scrollTo(0, 0);
}
function refresh(){
  const y = window.scrollY;
  $("dot").classList.toggle("on", online);
  $("stat").textContent = online ? "同期中" : "接続中…";
  if (state.tab === "input") renderInput();
  if (state.tab === "month") renderMonth();
  if (state.tab === "year") renderYear();
  if (state.tab === "master") renderMaster();
  window.scrollTo(0, y);
}

subscribeYear(state.year);
setTab("input");
</script>
